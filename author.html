<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>News Portal - Authors</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="container my-4">
    <!-- i. Breadcrumb Section -->
    <nav aria-label="breadcrumb">
      <ol class="breadcrumb bg-light p-3 rounded">
        <li class="breadcrumb-item"><a href="index.html">Home</a></li>
        <li class="breadcrumb-item active">Authors</li>
      </ol>
    </nav>

    <!-- ii. Editor Speech Section -->
    <div class="alert alert-info">
      <h5 class="fw-bold">Editorial Board Statement</h5>
      <p class="mb-0">Our reporters work tirelessly around the clock to bring verified facts straight to your screen.
      </p>
    </div>

    <!-- iii. Senior Reporter Section -->
    <h4 class="fw-bold my-3">Senior Reporters</h4>
    <div class="row row-cols-1 row-cols-md-3 g-4 mb-5">
      <div class="col">
        <div class="card h-100 shadow-sm">
          <img src="https://picsum.photos/200/200?random=70" class="card-img-top rounded-circle w-50 mx-auto mt-3"
            alt="Reporter">
          <div class="card-body text-center">
            <h5 class="card-title">Alice Brown</h5>
            <p class="text-muted">Chief Political Correspondent</p>
          </div>
        </div>
      </div>
    </div>

    <!-- iv. General Reporter Section -->
    <h4 class="fw-bold my-3">General Reporters</h4>
    <div class="row row-cols-1 row-cols-md-3 g-4">
      <div class="col">
        <div class="card h-100 shadow-sm">
          <img src="https://picsum.photos/200/200?random=71" class="card-img-top rounded-circle w-50 mx-auto mt-3"
            alt="Reporter">
          <div class="card-body text-center">
            <h5 class="card-title">David Wilson</h5>
            <p class="text-muted">Field Reporter</p>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>

</html>
