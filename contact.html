<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>News Portal - Contact Us</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="container my-4">
    <!-- i. Breadcrumb Section -->
    <nav aria-label="breadcrumb">
      <ol class="breadcrumb bg-light p-3 rounded">
        <li class="breadcrumb-item"><a href="index.html">Home</a></li>
        <li class="breadcrumb-item active">Contact Us</li>
      </ol>
    </nav>

    <div class="row g-4">
      <!-- ii. Direct Contact Info & Send Message Form -->
      <div class="col-md-6">
        <h4 class="fw-bold">Direct Contact Information</h4>
        <p class="text-muted">Address: 14/A, Estern Block, CUFL-4000,chattogram, Bangladesh</p>
        <p class="text-muted">Phone: +880 1680019139</p>
        <p class="text-muted">Email: contact@newsportal.com</p>

        <!-- iii. Send Message Form Section -->
        <h4 class="fw-bold mt-4">Send Message</h4>
        <form>
          <div class="mb-3">
            <label class="form-label">Name</label>
            <input type="text" class="form-control" required placeholder="Your Name">
          </div>
          <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" class="form-control" required placeholder="Your Email">
          </div>
          <div class="mb-3">
            <label class="form-label">Mobile</label>
            <input type="tel" class="form-control" required placeholder="Mobile Number">
          </div>
          <div class="mb-3">
            <label class="form-label">Message</label>
            <textarea class="form-control" rows="4" required placeholder="Write your message..."></textarea>
          </div>
          <button type="submit" class="btn btn-primary">Send Message</button>
        </form>
      </div>

      <!-- iv. Google Map API Section -->
      <div class="col-md-6">
        <h4 class="fw-bold">Our Location</h4>
        <div class="ratio ratio-4x3 rounded overflow-hidden shadow-sm">
          <iframe
            src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3651.902442430138!2d90.39108!3d23.75087!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x0%3A0x0!2zMjPCsDQ1JzAzLjEiTiA5M8KwMjMnMjcuOSJF!5e0!3m2!1sen!2sbd!4v1620000000000!5m2!1sen!2sbd"
            allowfullscreen="" loading="lazy"></iframe>
        </div>
      </div>
    </div>
  </div>
</body>

</html>
