<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>News Portal - Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body class="bg-light">

  <div class="container my-5">
    <!-- i. Breadcrumb Section -->
    <nav aria-label="breadcrumb">
      <ol class="breadcrumb bg-white p-3 rounded shadow-sm">
        <li class="breadcrumb-item"><a href="index.html">Home</a></li>
        <li class="breadcrumb-item active">Reporter Login</li>
      </ol>
    </nav>

    <!-- ii. Login Form Section -->
    <div class="row justify-content-center mt-5">
      <div class="col-md-5">
        <div class="card border-0 shadow">
          <div class="card-header bg-primary text-white text-center py-3">
            <h4 class="mb-0 fw-bold">Reporter Login</h4>
          </div>
          <div class="card-body p-4">
            <form id="loginForm">
              <div class="mb-3">
                <label class="form-label fw-bold">User Name</label>
                <input type="text" id="username" class="form-control" placeholder="Enter username" required>
              </div>
              <div class="mb-3">
                <label class="form-label fw-bold">Password</label>
                <input type="password" id="password" class="form-control" placeholder="Enter password" required>
              </div>
              <button type="submit" class="btn btn-primary w-100 fw-bold py-2">Login</button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
  <script src="script.js"></script>
</body>

</html>
